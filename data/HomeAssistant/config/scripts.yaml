vacuum_start:
  alias: "Vacuum: start cleaning"
  icon: mdi:robot-vacuum
  mode: single
  sequence:
    - action: vacuum.start
      target:
        entity_id: vacuum.xiaomi_de_1154971848_c102gl

vacuum_dock:
  alias: "Vacuum: return to dock"
  icon: mdi:home-import-outline
  mode: single
  sequence:
    - action: vacuum.return_to_base
      target:
        entity_id: vacuum.xiaomi_de_1154971848_c102gl

camera_arm:
  alias: "Camera: arm (Away)"
  icon: mdi:cctv
  mode: single
  sequence:
    - action: switch.turn_off
      target:
        entity_id: switch.tapo_c520ws_privacy
      continue_on_error: true
    - action: select.select_option
      target:
        entity_id: select.tapo_c520ws_motion_detection
      data:
        option: "on"
      continue_on_error: true
    - action: switch.turn_on
      target:
        entity_id:
          - switch.tapo_c520ws_notifications
          - switch.tapo_c520ws_trigger_alarm_on_motion_detection
          - switch.tapo_c520ws_trigger_alarm_on_people_detection
          - switch.tapo_c520ws_trigger_alarm_on_tamper_detection
          - switch.tapo_c520ws_record_to_sd_card
          - switch.tapo_c520ws_auto_track
          - switch.tapo_c520ws_smart_track_people
      continue_on_error: true

camera_disarm:
  alias: "Camera: disarm (privacy on)"
  icon: mdi:eye-off
  mode: single
  sequence:
    - action: select.select_option
      target:
        entity_id: select.tapo_c520ws_motion_detection
      data:
        option: "off"
      continue_on_error: true
    - action: switch.turn_off
      target:
        entity_id:
          - switch.tapo_c520ws_trigger_alarm_on_motion_detection
          - switch.tapo_c520ws_trigger_alarm_on_people_detection
          - switch.tapo_c520ws_auto_track
          - switch.tapo_c520ws_smart_track_people
      continue_on_error: true
    - action: switch.turn_on
      target:
        entity_id: switch.tapo_c520ws_privacy
      continue_on_error: true
