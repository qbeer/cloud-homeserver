# /etc/systemd/system/docker.service.d/wait-for-mount.conf
#
# Do NOT start dockerd until the media drive is mounted.
#
# docker's restart policy causes the daemon to auto-start all containers on
# boot. Without this drop-in the daemon races the drive mount and comes up
# against an empty, unmounted /mnt/drive, silently losing every app's config.

[Unit]
After=mnt-drive.mount
RequiresMountsFor=/mnt/drive